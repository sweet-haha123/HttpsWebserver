<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiteHub 主界面</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      color: #333;
    }
    header {
      background-color: #007BFF;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 1.5rem;
    }
    nav a {
      color: white;
      margin-left: 1.5rem;
      text-decoration: none;
      font-weight: bold;
    }
    .container {
      padding: 2rem;
      max-width: 1000px;
      margin: 0 auto;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: white;
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease-in-out;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .card h2 {
      margin-top: 0;
      font-size: 1.25rem;
    }
    .card p {
      color: #666;
    }
    .card a {
      display: inline-block;
      margin-top: 1rem;
      color: #007BFF;
      text-decoration: none;
      font-weight: bold;
    }
    .menu-option {
    display: inline-block;
    margin-top: 1rem;
    padding: 8px 16px; /* 增加内边距 */
    color: #0e0f0f;
    text-decoration: none;
    font-weight: bold;
    border: 2px solid #007BFF; /* 添加边框 */
    border-radius: 8px; /* 圆角边框 */
    transition: all 0.3s ease; /* 平滑过渡效果 */
    background-color: white; /* 确保背景不透明 */
    }

    /* 悬停效果 */
    .menu-option:hover {
    color: white !important;
    background-color: #007BFF; /* 背景色变化 */
    border-color: #0056b3; /* 边框颜色加深 */
    box-shadow: 0 2px 8px rgba(0,0,0,0.1); /* 添加阴影 */
    }

    /* 点击效果 */
    .menu-option:active {
    transform: scale(0.98); /* 模拟按钮按压效果 */
    }


    /* 加载动画容器 */
    #loading-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
    }

       
    /* 进度条 */
    .progress-bar {
        width: 300px;
        height: 20px;
        background: #444;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 0 10px #000;
    }

    .progress-bar-inner {
        height: 100%;
        background: linear-gradient(to right, #00c3ff, #00e1ff);
        width: 0;
        transition: width 1.5s ease;
    }

    /* 菜单页面样式 */
    #menu-container {
        display: none;
        text-align: center;
        padding: 50px 20px;
    }

  </style>
</head>
<body>
  <header>
    <h1>LiteHub</h1>
    <nav>
      <a href="/logout" id="logout">退出登录</a>
      <a href="/backend_status" id="backend_status">后台管理</a>
      <a href="/status">这个空着</a>
    </nav>
  </header>
  <div class="container">
    <h2>欢迎来到 LiteHub，一个集娱乐与实用功能为一体的平台！</h2>
    <div class="card-grid">
      <div class="card">
        <h2>🎮 五子棋对战</h2>
        <p>体验轻量弱AI五子棋对战</p>
        <div id="play-ai" class="menu-option">进入游戏 </div>
      </div>
      <div class="card">
        <h2>📁 上传/下载资源</h2>
        <p>支持多文件上传与压缩下载</p>
        <div id="resource_centor" class="menu-option">访问资源中心 </div>
      </div>
      <div class="card">
        <h2>📊 视频中心</h2>
        <p>支持视频预览、倍速、拖动进度条、暂停播放等</p>
        <div id="video_centor" class="menu-option">查看状态 </div>
      </div>
      <div class="card">
        <h2>📥 数据导入</h2>
        <p>支持CSV/Excel文件导入，包含数据校验和导入报告</p>
        <div id="data_import" class="menu-option">导入数据 </div>
      </div>
    </div>
  </div>
  <script>
       
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Page loaded'); // 调试日志
            
            const progressBar = document.querySelector('.progress-bar-inner');
            const loadingContainer = document.getElementById('loading-container');
            const menuContainer = document.getElementById('menu-container');

            if (!progressBar || !loadingContainer || !menuContainer) {
                console.error('Required elements not found');
                return;
            }

            // 强制触发重排以确保动画生效
            void progressBar.offsetWidth;
            
            // 设置进度条
            progressBar.style.width = '100%';

            // 监听过渡结束事件
            progressBar.addEventListener('transitionend', function() {
                console.log('Progress bar animation completed');
                loadingContainer.style.display = 'none';
                menuContainer.style.display = 'block';
            });

            // 添加超时保护
            setTimeout(() => {
                if (loadingContainer.style.display !== 'none') {
                    console.log('Timeout triggered - forcing menu display');
                    loadingContainer.style.display = 'none';
                    menuContainer.style.display = 'block';
                }
            }, 2000); // 2秒后强制显示菜单
        });

        //######################开始五子棋对战#############################################
        function startAiGame() {
            const userId = sessionStorage.getItem('userId');
            fetch('/aiBot/start', {
                method: 'GET',
                headers: {
                    'Accept': 'text/html'
                }
            })
            .then(response => response.text())
            .then(html => {
                // 完全清除当前页面
                document.open();
                document.write(html);
                document.close();
                
                // 确保在页面完全加载后初始化
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', function() {
                        if (typeof initializeGame === 'function') {
                            initializeGame();
                        }
                    });
                } else {
                    if (typeof initializeGame === 'function') {
                        initializeGame();
                    }
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('启动AI对战失败，请稍后重试！');
            });
        }
        // 绑定点击事件到对战AI按钮
        document.getElementById('play-ai').addEventListener('click', startAiGame);


        //######################资源中心跳转#########################################
          function goToResourceCentor() {
            window.location.href = '/resource_centor';
          }
          document.getElementById('resource_centor').addEventListener('click', goToResourceCentor);


        //######################视频中心跳转#########################################
        function goToVideoCentor() {
          window.location.href = '/video_centor';
        }
        document.getElementById('video_centor').addEventListener('click', goToVideoCentor);
        
        //######################数据导入跳转#########################################
        function goToDataImport() {
          window.location.href = '/data_import';
        }
        document.getElementById('data_import').addEventListener('click', goToDataImport);


          //######################后台状态跳转#########################################
          function goToBackendStatus() {
            window.location.href = '/backend_status';
          }
          document.getElementById('backend_status').addEventListener('click', goToBackendStatus);


        //######################退出登录操作#########################################
        document.getElementById('logout').addEventListener('click', (e) => {
          console.log("前端发起退出");
          e.preventDefault(); // 阻止默认跳转行为
          const userId = sessionStorage.getItem('userId');
            if (userId) {
                try {
                    // 创建 Blob 对象，指定 content-type
                    const data = new Blob([JSON.stringify({
                        userId: userId,
                        type: 'refresh',
                        gameType: 0
                    })], { type: 'application/json' });

                    // 使用 navigator.sendBeacon 发送异步请求
                    const success = navigator.sendBeacon('logout', data);

                    // 如果 sendBeacon 失败，尝试使用同步 XMLHttpRequest
                    if (success) 
                    {
                      window.location.href = '/'; //切换到登录界面

                    }
                    else{
                        const xhr = new XMLHttpRequest();
                        xhr.open('POST', 'logout', false); // 同步请求
                        xhr.setRequestHeader('Content-Type', 'application/json');
                        xhr.send(JSON.stringify({
                            userId: userId,
                            type: 'refresh',
                            gameType: 0
                        }));
                    }
                } catch (error) {
                    console.error('Logout error:', error);
                }
            }
      });


        // // 添加页面刷新/关闭时的处理,自动退出，确保当前的在线人数

        //             // // 使用 navigator.sendBeacon 发送异步请求
        //             // const success = navigator.sendBeacon('/user/logout', data);

        //             // if (!success) {
        //             //     const xhr = new XMLHttpRequest();
        //             //     xhr.open('POST', '/user/logout', false); // 同步请求
        //             //     xhr.setRequestHeader('Content-Type', 'application/json');
        //             //     xhr.send(JSON.stringify({
        //             //         userId: userId,
        //             //         type: 'refresh',
        //             //         gameType: 0
        //             //     }));
        //             //}
        //         } catch (error) {
        //             console.error('Logout error:', error);
        //         }
        //     }
        // });
        // 添加页面加载时的用户检查
        window.addEventListener('load', function() {
            const userId = sessionStorage.getItem('userId');
            if (!userId) {
                window.location.href = '/entry';
                return;
            }
        });



       
    </script>
</body>
</html>
